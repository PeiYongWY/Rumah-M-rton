[build]
  command = "npm run build"
  publish = "dist"

# bare address: Hungarian browsers go to /hu/ once it is switched on (uncomment), everyone else to /en/
# [[redirects]]
#   from = "/"
#   to = "/hu/"
#   status = 302
#   conditions = { Language = ["hu"] }
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

[[headers]]
  for = "/downloads/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
